<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWLSRV - Audio Transcriber</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .logo { font-size: 2rem; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌩️ Audio Transcriber</div>
        
        <div class="mb-3">
            <label for="apiToken" class="form-label">Token de API</label>
            <input type="password" class="form-control" id="apiToken" placeholder="Digite o token fixo">
            <div class="form-text">O mesmo token definido no Docker (API_TOKEN).</div>
        </div>

        <div class="mb-3">
            <label for="audioFile" class="form-label">Arquivo de Áudio (mp3, wav, ogg, m4a)</label>
            <input class="form-control" type="file" id="audioFile" accept="audio/*">
        </div>

        <button onclick="enviarAudio()" class="btn btn-primary w-100" id="btnEnviar">Transcrever</button>

        <div class="mt-4 d-none" id="resultArea">
            <h5>Resultado:</h5>
            <textarea class="form-control" id="transcriptionOutput" rows="6" readonly></textarea>
        </div>
    </div>

    <script>
        async function enviarAudio() {
            const token = document.getElementById('apiToken').value;
            const fileInput = document.getElementById('audioFile');
            const btn = document.getElementById('btnEnviar');
            const output = document.getElementById('transcriptionOutput');
            const resultArea = document.getElementById('resultArea');

            if (!fileInput.files[0]) return alert("Selecione um arquivo!");
            if (!token) return alert("Digite o token!");

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            btn.disabled = true;
            btn.innerText = "Processando... (pode demorar um pouco)";
            output.value = "";

            try {
                const response = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'x-api-token': token },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultArea.classList.remove('d-none');
                    output.value = data.transcription;
                } else {
                    alert("Erro: " + (data.detail || "Falha na requisição"));
                }
            } catch (error) {
                alert("Erro de conexão: " + error);
            } finally {
                btn.disabled = false;
                btn.innerText = "Transcrever";
            }
        }
    </script>
</body>
</html>
